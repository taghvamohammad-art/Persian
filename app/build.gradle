plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
}

android {
    namespace 'kittoku.osc'

    compileSdk 36

    defaultConfig {
        applicationId "ir.persianvpn.client"   // final before first release: changing it later makes a different app
        minSdk 23
        targetSdk 36
        // GitHub builds number themselves (versionCode = build number, so
        // every build is newer than the last and in-app updates see it);
        // local Android Studio builds stay at 1.
        def ciBuild = System.getenv("GITHUB_RUN_NUMBER")
        versionCode ciBuild ? ciBuild.toInteger() : 1
        versionName ciBuild ? "1.0.${ciBuild}" : "1.0.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Release signing for the automatic GitHub build: the keystore comes from
    // repository secrets (see .github/workflows/android.yml). Android Studio's
    // "Generate Signed APK" keeps working as before.
    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // pvcore.aar: Xray + AmneziaWG engine, built from mobile/ by GitHub
    // (.github/workflows/mobile-engine.yml); for a local build put it in app/libs
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.google.android.material:material:1.13.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
