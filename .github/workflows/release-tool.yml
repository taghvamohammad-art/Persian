name: Release tool (Windows)

on:
  push:
    branches: [main]
    paths:
      - "tools/release_tool/**"
      - "tools/sign_config.py"
      - "tools/icon/**"
      - "server/umstatus/umstatus.py"
      - "server/linux/**"
      - "server/mikrotik/**"
      - "mobile/**"
      - ".github/workflows/release-tool.yml"
  workflow_dispatch:

jobs:
  routeros:
    # the backup code against a real RouterOS (CHR) in QEMU
    runs-on: ubuntu-latest
    env:
      ROS_VERSION: "7.23.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check paramiko cryptography
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils unzip
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Unit tests
        working-directory: tools/release_tool
        run: python -m unittest test_backup test_provision test_backuptunnel test_settings test_mtxray -v

      - name: Download RouterOS ${{ env.ROS_VERSION }}
        run: |
          cd /tmp
          curl -fsSL -o chr.zip https://download.mikrotik.com/routeros/$ROS_VERSION/chr-$ROS_VERSION.img.zip
          curl -fsSL -o pkgs.zip https://download.mikrotik.com/routeros/$ROS_VERSION/all_packages-x86-$ROS_VERSION.zip
          unzip -q chr.zip && mkdir pkgs && unzip -q pkgs.zip -d pkgs && ls pkgs

      - name: Boot three CHRs
        run: |
          sudo apt-get install -y -q sstp-client ppp
          boot() {  # name ssh https sstp extra
            cp /tmp/chr-$ROS_VERSION.img /tmp/disk-$1.img
            qemu-img resize -f raw /tmp/disk-$1.img 1G   # like a real VPS disk; CHR grows into it
            qemu-system-x86_64 -enable-kvm -m 1024 -smp 1 -display none -daemonize \
              -drive file=/tmp/disk-$1.img,format=raw \
              -netdev user,id=n0,hostfwd=tcp:127.0.0.1:$2-:22,hostfwd=tcp:127.0.0.1:$3-:8443,hostfwd=tcp:127.0.0.1:$4-:443$5 \
              -device e1000,netdev=n0 \
              -serial unix:/tmp/chr-$1.sock,server,nowait -monitor unix:/tmp/mon-$1.sock,server,nowait
          }
          boot A 2222 18443 1443 ",hostfwd=udp:127.0.0.1:1812-:1812,hostfwd=udp:127.0.0.1:1813-:1813"
          boot B 2223 28443 2443 ""
          boot C 2224 38443 3443 ""
          for v in A B C; do timeout 300 python tools/release_tool/it/chr.py boot $v; done

      - name: Main server, backup, restore to a new router, secondary server
        run: timeout 2400 python tools/release_tool/it/chr.py all

  linux:
    # the Linux VPN server (this runner) against two real User Managers (CHR)
    runs-on: ubuntu-24.04
    env:
      ROS_VERSION: "7.23.2"
      ROOT_PW: "R00t-test-pw-1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check paramiko cryptography
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils unzip openssh-server dnsutils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build the app engine's probe (same code as the phone)
        working-directory: mobile
        run: |
          go mod tidy
          go build -o /tmp/pvprobe ./pvcore/cmd/probe
          go build -o /tmp/pvtuntest ./pvcore/cmd/tuntest
          go build -o /tmp/pvbspatch ./pvcore/cmd/bspatch

      - name: App updates - patches made by the tool (bsdiff4) rebuild the APK in the app's engine
        run: |
          python -m pip install --disable-pip-version-check bsdiff4
          python - <<'PY'
          import bsdiff4, os, random, subprocess
          for seed in range(5):
              rnd = random.Random(seed)
              old = bytearray(os.urandom(rnd.randint(1, 3_000_000)))
              new = bytearray(old)
              for _ in range(40):
                  p = rnd.randrange(len(new))
                  new[p:p + rnd.randint(0, 3000)] = os.urandom(rnd.randint(0, 5000))
              open("/tmp/o", "wb").write(old)
              open("/tmp/p", "wb").write(bsdiff4.diff(bytes(old), bytes(new)))
              subprocess.run(["/tmp/pvbspatch", "/tmp/o", "/tmp/p", "/tmp/n"], check=True)
              assert open("/tmp/n", "rb").read() == bytes(new), seed
              print("seed", seed, "ok:", len(new), "bytes from a", os.path.getsize("/tmp/p"), "byte patch")
          PY

      - name: Unit tests (agent and relay)
        run: |
          (cd server/linux && python -m unittest test_pv_agent -v)
          (cd server/mikrotik && sudo "$(which python)" -m unittest test_awgrelay test_xraybox -v)

      - name: Root SSH to this runner
        run: |
          echo "root:$ROOT_PW" | sudo chpasswd
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/00-pv.conf
          sudo mkdir -p /run/sshd && (sudo systemctl restart ssh || sudo systemctl restart sshd)

      - name: Boot two CHRs (User Manager 1 and 2)
        run: |
          cd /tmp
          curl -fsSL -o chr.zip https://download.mikrotik.com/routeros/$ROS_VERSION/chr-$ROS_VERSION.img.zip
          unzip -q chr.zip
          boot() {
            cp /tmp/chr-$ROS_VERSION.img /tmp/disk-$1.img
            qemu-img resize -f raw /tmp/disk-$1.img 1G
            qemu-system-x86_64 -enable-kvm -m 1024 -smp 1 -display none -daemonize \
              -drive file=/tmp/disk-$1.img,format=raw \
              -netdev user,id=n0,hostfwd=tcp:127.0.0.1:$2-:22,hostfwd=tcp:127.0.0.1:$3-:9443,hostfwd=udp:127.0.0.1:$4-:1812,hostfwd=udp:127.0.0.1:$5-:1813 \
              -device e1000,netdev=n0 \
              -serial unix:/tmp/chr-$1.sock,server,nowait -monitor unix:/tmp/mon-$1.sock,server,nowait
          }
          boot A 2222 19443 1812 1813
          boot B 2223 29443 2812 2813
          cd $GITHUB_WORKSPACE
          for v in A B; do timeout 300 python tools/release_tool/it/chr.py boot $v; done

      - name: Linux server end to end
        run: timeout 3000 python tools/release_tool/it/linux_it.py

      - name: Boot a third CHR (Xray in a container)
        run: |
          qemu-img create -f raw /tmp/disk-C.img 1G >/dev/null
          cp /tmp/chr-$ROS_VERSION.img /tmp/disk-C.img
          qemu-img resize -f raw /tmp/disk-C.img 1G
          f="hostfwd=tcp:127.0.0.1:2224-:22"
          for p in 30443 30444 30446 30447; do f="$f,hostfwd=tcp:127.0.0.1:$p-:$p"; done
          for p in 30445 30446; do f="$f,hostfwd=udp:127.0.0.1:$p-:$p"; done
          qemu-system-x86_64 -enable-kvm -m 1024 -smp 1 -display none -daemonize \
            -drive file=/tmp/disk-C.img,format=raw -netdev user,id=n0,$f -device e1000,netdev=n0 \
            -serial unix:/tmp/chr-C.sock,server,nowait -monitor unix:/tmp/mon-C.sock,server,nowait
          timeout 300 python tools/release_tool/it/chr.py boot C

      - name: Xray on a MikroTik (container) end to end
        run: timeout 1800 python tools/release_tool/it/box_it.py

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --disable-pip-version-check pyside6 pyinstaller paramiko cryptography bsdiff4

      - name: GUI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          PV_SHOTS: shots
        run: python tools/release_tool/release_gui.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-tool
          path: shots
          if-no-files-found: warn

      - name: Build exe
        shell: pwsh
        run: |
          $hidden = python tools/release_tool/stdlib_hidden.py
          pyinstaller --noconfirm --onefile --windowed `
            --name PersianVPN-Release `
            --icon tools/icon/app.ico `
            --add-data "tools/icon/icon-512.png;." `
            --add-data "tools/release_tool/BASE;." `
            --add-data "server/umstatus/umstatus.py;." --add-data "server/linux/pv_agent.py;." --add-data "server/linux/pvcreds.py;." --add-data "server/linux/pv_icmp.py;." --add-data "server/linux/site;site" --add-data "server/mikrotik/awgrelay.py;." --add-data "server/mikrotik/xraybox.py;." `
            --paths tools --paths tools/release_tool `
            --hidden-import release_gui --hidden-import bsdiff4 @hidden `
            tools/release_tool/launcher.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test the built exe
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PersianVPN-Release.exe -ArgumentList "--smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: The exe runs code from "get new features"
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $appdata = Join-Path $env:RUNNER_TEMP "appdata"
          python tools/release_tool/it/make_overlay.py (Join-Path $appdata "PersianVPNRelease/code")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:APPDATA = $appdata
          $env:PV_MARK = Join-Path $env:RUNNER_TEMP "mark.txt"
          $p = Start-Process -FilePath dist/PersianVPN-Release.exe -ArgumentList "--smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path $env:PV_MARK)) { Write-Error "code folder not used"; exit 1 }
          Get-Content $env:PV_MARK

      - uses: actions/upload-artifact@v4
        with:
          name: PersianVPN-Release
          path: dist/PersianVPN-Release.exe
          if-no-files-found: error
