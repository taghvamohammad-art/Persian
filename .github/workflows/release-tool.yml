name: Release tool (Windows)

on:
  push:
    branches: [main]
    paths:
      - "tools/release_tool/**"
      - "tools/sign_config.py"
      - "tools/icon/**"
      - "server/umstatus/umstatus.py"
      - ".github/workflows/release-tool.yml"
  workflow_dispatch:

jobs:
  routeros:
    # the backup code against a real RouterOS (CHR) in QEMU
    runs-on: ubuntu-latest
    env:
      ROS_VERSION: "7.23.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check paramiko cryptography
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 unzip
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Unit tests
        working-directory: tools/release_tool
        run: python -m unittest test_backup -v

      - name: Download RouterOS ${{ env.ROS_VERSION }}
        run: |
          cd /tmp
          curl -fsSL -o chr.zip https://download.mikrotik.com/routeros/$ROS_VERSION/chr-$ROS_VERSION.img.zip
          curl -fsSL -o pkgs.zip https://download.mikrotik.com/routeros/$ROS_VERSION/all_packages-x86-$ROS_VERSION.zip
          unzip -q chr.zip && mkdir pkgs && unzip -q pkgs.zip -d pkgs && ls pkgs

      - name: Boot three CHRs
        run: |
          sudo apt-get install -y -q sstp-client ppp
          boot() {  # name ssh https sstp extra
            cp /tmp/chr-$ROS_VERSION.img /tmp/disk-$1.img
            qemu-system-x86_64 -enable-kvm -m 1024 -smp 1 -display none -daemonize \
              -drive file=/tmp/disk-$1.img,format=raw \
              -netdev user,id=n0,hostfwd=tcp:127.0.0.1:$2-:22,hostfwd=tcp:127.0.0.1:$3-:8443,hostfwd=tcp:127.0.0.1:$4-:443$5 \
              -device e1000,netdev=n0 \
              -serial unix:/tmp/chr-$1.sock,server,nowait -monitor unix:/tmp/mon-$1.sock,server,nowait
          }
          boot A 2222 18443 1443 ",hostfwd=udp:127.0.0.1:1812-:1812,hostfwd=udp:127.0.0.1:1813-:1813"
          boot B 2223 28443 2443 ""
          boot C 2224 38443 3443 ""
          for v in A B C; do timeout 300 python tools/release_tool/it/chr.py boot $v; done

      - name: Main server, backup, restore to a new router, secondary server
        run: timeout 2400 python tools/release_tool/it/chr.py all

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --disable-pip-version-check pyside6 pyinstaller paramiko cryptography

      - name: GUI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/release_tool/release_gui.py --smoke

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PersianVPN-Release
          --icon tools/icon/app.ico
          --add-data "tools/icon/icon-512.png;."
          --add-data "server/umstatus/umstatus.py;." --paths tools --paths tools/release_tool
          tools/release_tool/release_gui.py

      - name: Smoke test the built exe
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PersianVPN-Release.exe -ArgumentList "--smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PersianVPN-Release
          path: dist/PersianVPN-Release.exe
          if-no-files-found: error
