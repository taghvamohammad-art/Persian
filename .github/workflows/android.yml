name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: umstatus tests
        working-directory: server/umstatus
        run: python -m unittest -v test_umstatus

      - name: release tool tests
        working-directory: tools/release_tool
        run: |
          python -m pip install --disable-pip-version-check bsdiff4 cryptography
          python -m unittest -v test_publisher test_apkdelta test_selfupdate

  engine:
    uses: ./.github/workflows/mobile-engine.yml

  apk:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Xray / AmneziaWG engine for the Linux servers
      - uses: actions/download-artifact@v4
        with:
          name: pvcore-aar
          path: engine
      - run: mkdir -p app/libs && cp engine/pvcore.aar app/libs/

      - name: Check server-config files
        run: |
          missing=0
          for f in app/src/main/assets/config_key.public.txt app/src/main/assets/app_config.signed.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing. Upload it to app/src/main/assets (see BUILD_FA.md)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: building a debug APK instead of a release APK."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the APK installs (signature, manifest)
        run: |
          apk=$(ls app/build/outputs/apk/*/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$apk" | head -8
          "$BT/aapt2" dump badging "$apk" | grep -E "^package:|sdkVersion|DiagnosticsActivity" || true
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -c "activity" 
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l "$apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          # the number in the name is the versionCode to pass to sign_config.py
          name: persian-vpn-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # «اپ تست سرورها» (tester/): a separate app, installed beside the VPN app
      - uses: actions/upload-artifact@v4
        with:
          name: persian-vpn-tester-${{ github.run_number }}
          path: |
            tester/build/outputs/apk/release/*.apk
            tester/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
