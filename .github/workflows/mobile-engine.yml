name: Mobile engine (pvcore.aar)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-engine.yml"
  workflow_dispatch:
  workflow_call:      # the APK build uses it

jobs:
  aar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Dependencies
        working-directory: mobile
        # versions are pinned in go.mod; to upgrade, run
        # go get <module>@latest && go mod tidy and commit go.mod
        run: |
          go mod tidy
          git diff --stat go.mod

      - name: Tests
        working-directory: mobile
        run: go vet ./... && go test ./...

      - name: gomobile bind (arm64, armv7)
        working-directory: mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          gomobile init
          gomobile bind -v -target=android/arm64,android/arm -androidapi 21 -trimpath -ldflags="-s -w -checklinkname=0 -buildid=" \
            -javapkg=ir.persianvpn -o pvcore.aar ./pvcore
          ls -la pvcore.aar

      - uses: actions/upload-artifact@v4
        with:
          name: pvcore-aar
          path: |
            mobile/pvcore.aar
            mobile/go.mod
            mobile/go.sum
