name: Windows client

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "mobile/**"
      - "app/src/main/assets/**"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build pvwin.exe (Xray + Wintun)
        working-directory: mobile
        run: |
          go mod tidy
          go test ./pvcore
          GOOS=windows GOARCH=amd64 go vet ./pvcore ./cmd/pvwin
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid= -X main.version=${{ github.run_number }}" -o ../pvwin.exe ./cmd/pvwin
          ls -la ../pvwin.exe
      - name: Wintun driver DLL
        run: |
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c
          unzip -q wintun.zip && cp wintun/bin/amd64/wintun.dll .
      - uses: actions/upload-artifact@v4
        with:
          name: pvwin
          path: |
            pvwin.exe
            wintun.dll

  app:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pvwin
          path: windows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --disable-pip-version-check pyside6 pyinstaller cryptography pytest
      - name: Bundle the signed config of the app
        shell: pwsh
        run: |
          Copy-Item app/src/main/assets/app_config.signed.json windows/
          Copy-Item app/src/main/assets/config_key.public.txt windows/
          Copy-Item tools/icon/icon-512.png windows/
      - name: Tests
        run: python -m pytest -q windows/test_pvclient.py
      - name: Engine smoke test (service protocol, a server that does not answer)
        shell: pwsh
        run: |
          Copy-Item app/src/main/assets/config_key.public.txt windows/
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo.FileName = (Resolve-Path windows/pvwin.exe).Path
          $p.StartInfo.Arguments = "console"
          $p.StartInfo.RedirectStandardInput = $true
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.UseShellExecute = $false
          $p.Start() | Out-Null
          Start-Sleep -Seconds 3
          python windows/svc_smoke.py ${{ github.run_number }}
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); exit 1 }
      - name: Service install, talk, uninstall
        shell: pwsh
        run: |
          windows/pvwin.exe install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 5
          Get-Service PersianVPN
          python windows/svc_smoke.py ${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          windows/pvwin.exe uninstall
      - name: Build number
        shell: pwsh
        run: |
          "BUILD = ${{ github.run_number }}" | Set-Content -Encoding ascii windows/_build.py
          "${{ github.run_number }}" | Set-Content -Encoding ascii version.txt
      - name: GUI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python windows/pvclient.py --smoke
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PersianVPN
          --icon tools/icon/app.ico
          --add-binary "windows/pvwin.exe;." --add-binary "windows/wintun.dll;."
          --add-data "windows/app_config.signed.json;." --add-data "windows/config_key.public.txt;."
          --add-data "windows/icon-512.png;."
          --paths windows
          windows/pvclient.py
      - name: Package (app, engine, build number)
        shell: pwsh
        run: |
          Copy-Item windows/pvwin.exe dist/
          Copy-Item version.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: PersianVPN-Windows
          path: |
            dist/PersianVPN.exe
            dist/pvwin.exe
            dist/version.txt
          if-no-files-found: error
