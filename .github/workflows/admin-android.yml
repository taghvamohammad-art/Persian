name: Admin app (Android)

# Persian Admin: the release tool on the phone (Flet). Its screens are
# tools/admin_android/src/admin_app.py; everything else is the release
# tool's own code, copied in here.

on:
  push:
    branches: [main]
    paths:
      - "tools/admin_android/**"
      - "tools/release_tool/**"
      - "tools/sign_config.py"
      - "server/umstatus/umstatus.py"
      - "server/linux/**"
      - "server/mikrotik/**"
      - ".github/workflows/admin-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the tool's code
        run: |
          set -e
          cd tools/admin_android/src
          for f in ../../release_tool/*.py; do
            case "$(basename "$f")" in test_*|release_gui.py|stdlib_hidden.py) ;; *) cp "$f" . ;; esac
          done
          cp ../../sign_config.py ../../../server/umstatus/umstatus.py ../../../server/linux/pv_agent.py \
             ../../../server/linux/pvcreds.py ../../../server/mikrotik/awgrelay.py .
          cp -r ../../../server/linux/site site
          cp ../BASE BASE_ANDROID
          mkdir -p assets && cp ../../icon/icon-512.png assets/icon.png
          ls

      - name: Smoke test (every screen and dialog)
        run: |
          python -m pip install --disable-pip-version-check "flet==1.1.2" paramiko cryptography
          cd tools/admin_android/src
          APPDATA="$RUNNER_TEMP/appdata" python admin_app.py --smoke
          # the launcher finds the entry and the compatibility number of the phone version
          APPDATA="$RUNNER_TEMP/appdata" PV_ENTRY=admin_app PV_BASE_FILE=BASE_ANDROID \
            python -c "import selfupdate as su; assert su.bundled_base() == open('BASE_ANDROID').read().strip(); print('base', su.bundled_base())"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: the APK is signed with a debug key."
          fi

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python -m pip install --disable-pip-version-check "flet-cli==1.1.2"
          cd tools/admin_android
          flet build apk --yes --no-rich-output --build-number ${{ github.run_number }} --build-version 1.0.${{ github.run_number }} -v

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Persian-Admin-${{ github.run_number }}
          path: tools/admin_android/build/apk/*.apk
          if-no-files-found: error
