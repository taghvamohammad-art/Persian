[project]
name = "persian-admin"
version = "1.0.0"
description = "Persian VPN release and server tool for Android"
requires-python = ">=3.12"
dependencies = [
  "flet==1.1.2",
  "paramiko>=3.4,<4",
  "cryptography",
  "bcrypt",
  "pynacl",
  "certifi",
]

[tool.flet]
org = "ir.persianvpn"
# its own Android id: never the VPN app's (ir.persianvpn.client)
bundle_id = "ir.persianvpn.admin"
product = "Persian Admin"
company = "Persian VPN"
copyright = "Persian VPN"

[tool.flet.app]
path = "src"

# keep the .py files: some are not run here but sent to the routers and
# servers as they are (umstatus.py, pv_agent.py, awgrelay.py ...)
[tool.flet.compile]
app = false

[tool.flet.android]
split_per_abi = false
